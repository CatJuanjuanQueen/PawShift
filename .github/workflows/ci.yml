name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run package:dir
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: PawShift-WebView2-x64
          path: release-webview2/*-WebView2-x64.zip
          if-no-files-found: error
